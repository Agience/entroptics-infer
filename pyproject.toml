[project]
name = "entroptics-infer"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL_LICENSE.md", "PATENTS.md"]
version = "0.1.0"
description = "Inference from a corpus's live geometry: attention weights measured from relational structure at read time, with no trained model and no fitted constant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ikailo John Sessford" }]
maintainers = [{ name = "Ikailo Inc." }]
keywords = ["inference", "neurosymbolic", "attention", "model-free", "ontology", "knowledge-graph", "entroptics", "mantle"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "entroptics>=0.2.12",
]

[project.urls]
Homepage = "https://github.com/Agience/entroptics-infer"
Source = "https://github.com/Agience/entroptics-infer"
Issues = "https://github.com/Agience/entroptics-infer/issues"
Instrument = "https://pypi.org/project/entroptics/"
Store = "https://pypi.org/project/agience-mantle/"

[project.scripts]
# The proof of concept, as a command. `--far` is required and has no default: it is the
# reader's level and the one number this program does not derive.
entroptics-infer = "entroptics_infer.__main__:main"

[project.optional-dependencies]
# The store seam. Optional so the instrument half of the package installs and tests
# without a lattice on disk; `store.py` raises a stated error when it is absent.
store = ["agience-mantle"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["entroptics_infer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:asyncio"
filterwarnings = ["error::RuntimeWarning"]
